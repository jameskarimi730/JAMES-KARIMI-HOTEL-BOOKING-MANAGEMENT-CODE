
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora Grand Hotel | Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>NEXORA GRAND HOTEL</h1>
        <p>Hotel Booking Management System</p>
    </header>

    <nav>
        <button onclick="showSection('dashboard')">Dashboard</button>
        <button onclick="showSection('rooms')">Rooms</button>
        <button onclick="showSection('bookings')">Bookings</button>
        <button onclick="showSection('payments')">Payments</button>
    </nav>

    <main>
        <section id="dashboard" class="section">
            <h2>Dashboard Overview</h2>
            <div class="stats">
                <div class="stat-card">
                    <h3>Total Rooms</h3>
                    <p id="totalRooms">10</p>
                </div>
                <div class="stat-card">
                    <h3>Active Bookings</h3>
                    <p id="totalBookings">0</p>
                </div>
                <div class="stat-card">
                    <h3>Available Rooms</h3>
                    <p id="availableRooms">10</p>
                </div>
                <div class="stat-card">
                    <h3>Payments Received</h3>
                    <p id="totalPayments">KSh 0</p>
                </div>
            </div>
        </section>

        <section id="rooms" class="section hidden">
            <h2>Room Availability</h2>
            <div id="roomList"></div>
        </section>

        <section id="bookings" class="section hidden">
            <h2>Register Guest Booking</h2>

            <form id="bookingForm">
                <input id="guestName" placeholder="Guest Full Name" required>
                <input id="phone" placeholder="Phone Number" required>
                <input id="idNumber" placeholder="National ID / Passport" required>

                <select id="roomNumber" required>
                    <option value="">Select Room</option>
                </select>

                <input id="nights" type="number" min="1"
                       placeholder="Number of Nights" required>

                <button type="submit">Create Booking</button>
            </form>

            <h2>Booking Records</h2>
            <input id="searchBooking" placeholder="Search guest or booking ID">
            <div id="bookingList"></div>
        </section>

        <section id="payments" class="section hidden">
            <h2>Record Guest Payment</h2>
            <form id="paymentForm">
                <input id="paymentBookingId" type="number"
                       placeholder="Booking ID" required>
                <input id="paymentAmount" type="number" min="1"
                       step="0.01" placeholder="Amount in KSh" required>
                <button type="submit">Record Payment</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Nexora Grand Hotel. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
